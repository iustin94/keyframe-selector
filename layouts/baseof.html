<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.Title }}</title>
  {{ with resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}">
  {{ end }}
</head>
<body>
  {{ block "main" . }}{{ end }}
  {{ with resources.Get "js/main.js" | js.Build (dict "format" "esm" "target" "es2022" "minify" hugo.IsProduction) | fingerprint }}
  <script type="module" src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}"></script>
  {{ end }}
</body>
</html>
